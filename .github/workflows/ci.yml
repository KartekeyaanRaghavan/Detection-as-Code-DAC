name: detections

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml sigma-cli pysigma-backend-microsoft365defender

      - name: Every detection has its four files
        run: |
          fail=0
          for dir in detections/*/; do
            for f in rule.yml detection.kql notes.md validation.md; do
              if [ ! -f "$dir$f" ]; then
                echo "::error::missing $dir$f"
                fail=1
              fi
            done
          done
          exit $fail

      - name: Sigma rules are valid YAML with the required fields
        run: python tools/check_rules.py

      - name: Sigma rules convert to Defender XDR KQL
        run: |
          for rule in detections/*/rule.yml; do
            echo "--- $rule"
            sigma convert -t microsoft365defender "$rule" || echo "::warning::conversion failed for $rule"
          done

      - name: Detection logic tests
        run: python tools/run_tests.py
